<svg width="640" height="800" viewBox="0 0 640 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HVB signal poster</title>
  <desc id="desc">Abstract neon research poster with waveform, cells, code tracks, and HVB monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101F22"/>
      <stop offset="0.52" stop-color="#07110F"/>
      <stop offset="1" stop-color="#111632"/>
    </linearGradient>
    <linearGradient id="hot" x1="70" y1="110" x2="570" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF3B7F"/>
      <stop offset="0.48" stop-color="#29D8FF"/>
      <stop offset="1" stop-color="#C8FF4D"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#F6FFE9" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <rect width="6" height="16" fill="#C8FF4D" fill-opacity="0.32"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="800" fill="url(#bg)"/>
  <rect width="640" height="800" fill="url(#grid)"/>
  <path d="M-32 176L640 28V128L-32 292V176Z" fill="#FF3B7F" fill-opacity="0.18"/>
  <path d="M152 0H246L92 800H0L152 0Z" fill="url(#stripes)" opacity="0.5"/>
  <path d="M540 0H640V800H458L540 0Z" fill="#29D8FF" fill-opacity="0.08"/>

  <g opacity="0.88">
    <rect x="54" y="48" width="532" height="704" rx="0" stroke="#F6FFE9" stroke-opacity="0.32" stroke-width="2"/>
    <path d="M54 106H586" stroke="#F6FFE9" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M54 664H586" stroke="#F6FFE9" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M110 48V752" stroke="#F6FFE9" stroke-opacity="0.12"/>
    <path d="M530 48V752" stroke="#F6FFE9" stroke-opacity="0.12"/>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" letter-spacing="0" fill="#F6FFE9">
    <text x="80" y="86">HVB.SIGNAL</text>
    <text x="390" y="86" fill="#C8FF4D">ONLINE</text>
    <text x="80" y="706" fill="#9FB0A5">AI SYSTEMS / GENETICS</text>
    <text x="80" y="732" fill="#9FB0A5">SOUTH TEXAS RESEARCH DESK</text>
  </g>

  <g filter="url(#glow)">
    <path d="M98 498C142 430 176 552 216 468C262 370 292 548 336 454C382 356 414 508 452 426C490 342 510 390 542 322" stroke="url(#hot)" stroke-width="8" stroke-linecap="round"/>
    <path d="M98 535C142 498 174 570 222 530C272 488 316 576 360 524C404 472 450 548 542 470" stroke="#C8FF4D" stroke-opacity="0.78" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g>
    <circle cx="170" cy="206" r="48" stroke="#29D8FF" stroke-width="4"/>
    <circle cx="170" cy="206" r="12" fill="#29D8FF"/>
    <circle cx="472" cy="198" r="62" stroke="#C8FF4D" stroke-width="4" stroke-dasharray="10 8"/>
    <circle cx="472" cy="198" r="14" fill="#C8FF4D"/>
    <circle cx="424" cy="610" r="44" stroke="#FF3B7F" stroke-width="4"/>
    <circle cx="424" cy="610" r="10" fill="#FF3B7F"/>
    <path d="M182 214L424 610M228 456L472 198M424 610L542 322" stroke="#F6FFE9" stroke-opacity="0.16" stroke-width="2"/>
  </g>

  <g font-family="Bricolage Grotesque, Space Grotesk, sans-serif" font-weight="800" letter-spacing="0">
    <text x="76" y="390" font-size="174" fill="#F6FFE9">HVB</text>
    <text x="86" y="390" font-size="174" fill="#FF3B7F" opacity="0.56">HVB</text>
    <text x="72" y="382" font-size="174" fill="none" stroke="#C8FF4D" stroke-width="2">HVB</text>
  </g>

  <g font-family="JetBrains Mono, monospace" font-weight="700" font-size="14" letter-spacing="0">
    <rect x="86" y="566" width="170" height="34" fill="#FF3B7F"/>
    <text x="104" y="588" fill="#FFF8FB">SIM RUN 001</text>
    <rect x="270" y="566" width="152" height="34" fill="#29D8FF"/>
    <text x="288" y="588" fill="#06100E">LORA TEST</text>
    <rect x="436" y="566" width="94" height="34" fill="#C8FF4D"/>
    <text x="454" y="588" fill="#06100E">LOGS</text>
  </g>

  <g opacity="0.58">
    <path d="M80 134H238M80 150H196M80 166H222" stroke="#F6FFE9" stroke-width="3"/>
    <path d="M404 690H556M404 706H526M404 722H542" stroke="#F6FFE9" stroke-width="3"/>
  </g>
</svg>
